services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ghostwriter
      POSTGRES_USER: ghostwriter
      POSTGRES_PASSWORD: ghostwriter
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostwriter"]
      interval: 5s
      timeout: 5s
      retries: 10

  graphql_engine:
    image: hasura/graphql-engine:v2.40.0.cli-migrations-v3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://ghostwriter:ghostwriter@postgres:5432/ghostwriter
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecret
      HASURA_GRAPHQL_METADATA_DIR: /metadata
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_SERVER_PORT: "8080"
    volumes:
      - ./hasura/metadata:/metadata
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  beacon_loader:
    build: ./beacon_loader
    depends_on:
      graphql_engine:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      HASURA_URL: http://graphql_engine:8080/v1/graphql
      HASURA_ADMIN_SECRET: myadminsecret
      REDIS_URL: redis://redis:6379/0
      OPLOG_ID: "1"
      DATA_DIR: /data
      BATCH_SIZE: "100"
    volumes:
      - ./data:/data:ro

  metabase:
    image: metabase/metabase:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ghostwriter
      MB_DB_PASS: ghostwriter
      MB_DB_HOST: postgres
    ports:
      - "3000:3000"
    volumes:
      - metabase_data:/metabase-data

  streamlit:
    build: ./streamlit_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ghostwriter
      POSTGRES_USER: ghostwriter
      POSTGRES_PASSWORD: ghostwriter
      HASURA_URL: http://graphql_engine:8080/v1/graphql
      HASURA_ADMIN_SECRET: myadminsecret
      LLM_ENDPOINT: ""  # Empty = chat stub only. Future: http://ollama:11434
    ports:
      - "8501:8501"

volumes:
  pgdata:
  redisdata:
  metabase_data:
